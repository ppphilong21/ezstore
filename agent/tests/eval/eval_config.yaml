# EZStore quotation agent — eval metrics (spec 2.7). Used by:
#   agents-cli eval run --dataset tests/eval/datasets/<file>.json --config tests/eval/eval_config.yaml
# metrics_to_run is fixed to these four names; eval-lab.md relies on them.
metrics_to_run:
  - custom_response_quality
  - link_present
  - refusal_or_action
  - agent_turn_count

custom_metrics:
  # LLM judge, 1–5 (scaffold default; runs locally via google-genai with GEMINI_API_KEY or ADC)
  - name: custom_response_quality
    custom_function_file: response_quality.py

  # Code check, 0/1: plain-text /quotations/<id> or /orders/<id> link; Markdown link = 0;
  # cases whose eval_case_id starts with off_topic need no link.
  - name: link_present
    custom_function_file: link_presence.py

  # LLM judge, 0/1 — runs locally (refusal_or_action.py) with GEMINI_API_KEY. A prompt_template
  # metric would go to the Gemini platform Eval Service, which needs a GCP project + ADC.
  # The judge sees only {response} and {agent_data} (multi-turn cases have no prompt).
  - name: refusal_or_action
    custom_function_file: refusal_or_action.py

  # Number of conversation turns (not a score): 2 for the multi-turn case, 1 otherwise.
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
