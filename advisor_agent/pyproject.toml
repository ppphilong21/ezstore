[project]
name = "ezstore-sales-advisor"
version = "0.1.0"
description = "EZStore sales advisor agent: OKF knowledge + A2A delegation to the quotation agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[a2a]>=2.10,<3",
    "a2a-sdk[http-server]>=1.0,<2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sales_advisor"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
